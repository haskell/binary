name: Haskell CI

on:
  - push
  - pull_request

jobs:
  ghc:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ghc: ['8.0.2', '8.2.2', '8.4.4', '8.6.5', '8.8.4', '8.10.7', '9.0.2', '9.2.8', '9.4.8', '9.6.7', '9.8.4', '9.10.3', '9.12.2', '9.14.1']
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: ${{ matrix.ghc }}
      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-${{ matrix.ghc }}
      - name: Build
        run: cabal build all
      - name: Build tests
        run: cabal build all --enable-tests
      - name: Test
        run: cabal test all
      - name: Build benchmarks
        run: cabal build all --enable-benchmarks
      - name: Haddock
        run: cabal haddock -z

  ghc-i386:
    runs-on: ubuntu-24.04
    container:
      image: i386/ubuntu
    steps:
      - uses: actions/checkout@v1 # newer version don't work
      - name: Install GHCup
        run: |
          apt-get update -y
          apt-get install -y autoconf build-essential zlib1g-dev libgmp-dev curl libncurses5 libtinfo5 libncurses5-dev libtinfo-dev
          curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | BOOTSTRAP_HASKELL_NONINTERACTIVE=1 BOOTSTRAP_HASKELL_INSTALL_NO_STACK=1 BOOTSTRAP_HASKELL_GHC_VERSION=9.6.7 sh
          echo "$HOME/.cabal/bin:$HOME/.ghcup/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cabal build all
      - name: Test
        run: cabal test all

  mhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: binary
      - name: Checkout MicroHs repository
        uses: actions/checkout@v6
        with:
          repository: augustss/MicroHs
          path: mhs
      - name: Install MicroHs
        run: |
          cd mhs
          make minstall
          echo "$HOME/.mcabal/bin" >> $GITHUB_PATH
      - name: Install binary
        run: |
          cd binary
          mcabal -r install
